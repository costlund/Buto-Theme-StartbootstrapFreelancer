settings:
  path: '1/innerHTML/1/innerHTML'
content:
  -
    type: text
    text: '<!DOCTYPE html>'
  -
    type: html
    attribute:
      la: globals:_SESSION/i18n/language
    innerHTML:
      -
        type: head
        innerHTML:
          -
            type: widget
            data:
              plugin: 'theme/include'
              method: include
              data:
                bootstrap:
                  version: 5
          -
            type: text
            text: |
              <link rel="icon" type="image/x-icon" href="/theme/startbootstrap/freelancer/assets/favicon.ico" />
              <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
              <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css" />
              <link href="https://fonts.googleapis.com/css?family=Lato:400,700,400italic,700italic" rel="stylesheet" type="text/css" />
              <link href="/theme/startbootstrap/freelancer/css/styles.css" rel="stylesheet" />
              <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
              <script src="/theme/startbootstrap/freelancer/js/scripts.js"></script>
      -
        type: body
        innerHTML: 'body...'