-
  type: section
  attribute:
    class: 'page-section portfolio'
    id: portfolio
  innerHTML:
    -
      type: div
      attribute:
        class: container
      innerHTML:
        -
          type: h2
          attribute:
            class: 'page-section-heading text-center text-uppercase text-secondary mb-0'
          innerHTML: Portfolio
        -
          type: div
          attribute:
            class: divider-custom
          innerHTML:
            -
              type: div
              attribute:
                class: divider-custom-line
            -
              type: div
              attribute:
                class: divider-custom-icon
              innerHTML:
                -
                  type: i
                  attribute:
                    class: 'fas fa-star'
            -
              type: div
              attribute:
                class: divider-custom-line
